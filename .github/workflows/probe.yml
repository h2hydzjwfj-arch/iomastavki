name: tnved-base-build
on:
  push:
    branches: [tnved-probe]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Собрать справочник ТН ВЭД с alta.ru
        run: node tools/probe-tree.js
      - name: Сохранить в ветку tnved-base-data
        if: always()
        run: |
          test -f data/tnved-base.json || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tnved-base-data
          git rm -rq --cached . ; git add -f data/tnved-base.json
          git commit -q -m "Справочник ТН ВЭД $(date -u +%F)"
          git push -f origin tnved-base-data
