# Проверка живого сайта (только чтение, ничего не создаёт). Раз в день и по кнопке.
name: live-check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Адрес сайта для проверки'
        required: false
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ inputs.url || vars.SITE_URL || 'https://iomastavki.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node test/live.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-screenshots
          path: test-output/
          retention-days: 14
