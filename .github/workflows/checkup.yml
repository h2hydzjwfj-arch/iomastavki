# Полная автоматическая проверка при каждом изменении: тесты, сервер целиком, браузер.
name: checkup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checkup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Модульные тесты
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Скрипт проверки ТН ВЭД (Python)
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python -m unittest tools/test_tnved_check.py
      - name: Сервер целиком (гость, клиент, администратор)
        run: node test/e2e.js
      - name: Браузер
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node test/ui.js
      - name: Наглядная проверка (видео + переписка бота)
        if: always()
        run: node test/showcase.js
      - name: Отчёт в ветку checkup-report
        if: always() && github.event_name != 'pull_request'
        run: |
          cd test-output
          git init -q && git checkout -q -b checkup-report
          git add -A && git -c user.name=checkup -c user.email=checkup@users.noreply.github.com commit -qm "Отчёт проверки ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" checkup-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-output/
          retention-days: 14
