# Будит сайт на Render каждые 10 минут, чтобы бесплатный сервис не засыпал.
# Адрес можно поменять: Settings → Secrets and variables → Actions → Variables → SITE_URL.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://iomastavki.onrender.com' }}
        run: curl -fsS --retry 4 --retry-delay 20 --max-time 90 "$SITE_URL/api/health"
