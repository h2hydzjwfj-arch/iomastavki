
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a9cfe5">
  <title>iomastavka</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="weatherScene" class="weather-scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
    <div class="rain"></div><div class="snow"></div>
    <div class="wave wave-back"></div><div class="wave wave-mid"></div><div class="wave wave-front"></div>
  </div>

  <header class="topbar">
    <button id="menuButton" class="hamsa-button" aria-label="Меню" title="Меню">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 8c-4 0-6 5-6 11V8c0-3-2-5-5-5s-5 2-5 6v17l-4-8c-1-3-4-4-6-2-2 1-2 4-1 7l7 16c2 5 6 8 11 9v8h18v-8c5-2 9-6 11-11l5-15c1-3 0-6-3-7-2-1-5 1-6 4l-2 6V15c0-3-2-5-5-5s-5 2-5 6v-6c0-3-2-5-4-5s-5 2-5 6V8c0-3-2-5-5-5s-5 2-5 5v7c0-4-2-7-5-7z"/>
      </svg>
    </button>
    <div class="brand" aria-label="iomastavka">
      <span>i</span><span>o</span><span>m</span><span>a</span><span>s</span><span>t</span><span>a</span><span>v</span><span>k</span><span>a</span>
    </div>
    <div class="top-actions">
      <button class="lang active" data-lang="ru">🇷🇺</button>
      <button class="lang" data-lang="en">🇬🇧</button>
      <button class="lang" data-lang="zh">🇨🇳</button>
      <button id="logoutButton" class="logout">Выйти</button>
    </div>
  </header>

  <main class="page">
    <section class="card" id="calculator">
      <h1 data-i18n="title">Рассчитать параметры груза</h1>

      <div class="route">
        <div class="field autocomplete">
          <label data-i18n="from">Откуда</label>
          <input id="fromCity" autocomplete="off" placeholder="Город в Китае">
          <div id="fromSuggestions" class="suggestions"></div>
        </div>
        <div class="route-arrow">→</div>
        <div class="field autocomplete">
          <label data-i18n="to">Куда</label>
          <input id="toCity" autocomplete="off" placeholder="Город в России">
          <div id="toSuggestions" class="suggestions"></div>
        </div>
      </div>

      <div class="section-title"><span data-i18n="cargo">ГРУЗ</span></div>
      <div class="grid three">
        <div class="field"><label data-i18n="weight">Вес, кг</label><input id="weight" type="number" min="0" value="280"></div>
        <div class="field"><label data-i18n="pieces">Количество мест</label><input id="pieces" type="number" min="1" value="1"></div>
        <div class="field"><label data-i18n="distance">Расстояние, км</label><input id="distance" type="number" min="0" placeholder="Автоматически"></div>
      </div>

      <div class="dimensions">
        <div class="dimensions-head"><span data-i18n="dimensions">ГАБАРИТЫ ОДНОГО МЕСТА, ММ</span><small data-i18n="volumeAll">Объём — по всем местам</small></div>
        <div class="grid three">
          <div class="field"><label data-i18n="length">Длина</label><input id="length" type="number" min="0" value="1950"></div>
          <div class="field"><label data-i18n="width">Ширина</label><input id="width" type="number" min="0" value="1400"></div>
          <div class="field"><label data-i18n="height">Высота</label><input id="height" type="number" min="0" value="1850"></div>
        </div>
      </div>

      <div class="grid four">
        <div class="field hover-select">
          <label data-i18n="forwarder">Экспедитор</label>
          <button class="fake-select" id="forwarderBtn"><span data-i18n="chooseForwarder">Выберите экспедитора</span><b>⌄</b></button>
          <div class="hover-menu" id="forwarderMenu"></div>
        </div>
        <div class="field hover-select">
          <label data-i18n="transport">Вид транспорта</label>
          <button class="fake-select" id="transportBtn"><span data-i18n="chooseTransport">Выберите транспорт</span><b>⌄</b></button>
          <div class="hover-menu" id="transportMenu"></div>
        </div>
        <div class="field hover-select">
          <label data-i18n="incoterms">Условия поставки</label>
          <button class="fake-select" id="incotermBtn"><span>EXW</span><b>⌄</b></button>
          <div class="hover-menu" id="incotermMenu"></div>
        </div>
        <div class="field hover-select">
          <label data-i18n="dimWeight">Объёмный вес</label>
          <button class="fake-select" id="factorBtn"><span>1 м³ = 167 кг</span><b>⌄</b></button>
          <div class="hover-menu" id="factorMenu"></div>
        </div>
      </div>

      <div class="selected-forwarder" id="selectedForwarder">
        <span><small data-i18n="selected">ЭКСПЕДИТОР</small><strong data-i18n="none">Не выбран</strong></span>
        <em id="capabilities">—</em>
      </div>

      <div id="recommendation" class="recommendation hidden"></div>
      <button id="calculate" class="calculate" data-i18n="calculate">Рассчитать</button>

      <div id="result" class="result hidden"></div>
    </section>
  </main>

  <aside id="sideMenu" class="side-menu">
    <button id="agentsOpen" data-i18n="agents">Экспедиторы</button>
    <button id="assistantOpen" data-i18n="assistant">ИИ-ассистент</button>
    <button id="menuLogout" data-i18n="logout">Выйти</button>
  </aside>

  <aside id="agentsPanel" class="floating-panel">
    <div class="panel-title" data-i18n="agents">Экспедиторы</div>
    <div id="agentGroups"></div>
  </aside>

  <aside id="assistantPanel" class="assistant-panel">
    <div class="assistant-head">
      <div><strong data-i18n="assistant">ИИ-ассистент</strong><small data-i18n="assistantSub">Обновление ставок</small></div>
      <button id="assistantClose">×</button>
    </div>
    <p data-i18n="assistantHelp">Передай ставку обычным текстом. Например: «MultiWell Китай Москва ЖД 1800 USD за тонну».</p>
    <textarea id="rateInput" placeholder="Введи новые ставки..."></textarea>
    <button id="saveRate" class="assistant-save" data-i18n="updateRates">Обновить ставки</button>
    <div id="assistantStatus"></div>
    <div id="ratePreview"></div>
  </aside>

  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
