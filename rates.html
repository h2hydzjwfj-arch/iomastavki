<main class="app-shell">
<section id="calculatorView" class="view-layer" aria-hidden="true"><section class="card calculator-card" id="calculator"><button class="close-button view-close" data-close-view="calculator" data-i18n-aria="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<h1 data-i18n="title">Расчёт маршрута</h1>
<div class="route"><div class="field autocomplete"><label data-i18n="from">Откуда</label><input id="fromCity" autocomplete="off" placeholder="Город в Китае"><div id="fromSuggestions" class="suggestions"></div></div><div class="route-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><div class="field autocomplete"><label data-i18n="to">Куда</label><input id="toCity" autocomplete="off" placeholder="Город в России"><div id="toSuggestions" class="suggestions"></div></div></div>
<div class="section-title"><span data-i18n="cargo">ГРУЗ</span></div>
<div class="grid three"><div class="field"><label data-i18n="weight">Вес, кг</label><input id="weight" type="number" min="0" placeholder="0"></div><div class="field"><label data-i18n="pieces">Количество мест</label><input id="pieces" type="number" min="1" placeholder="1"></div><div class="field"><label data-i18n="distance">Расстояние, км</label><input id="distance" type="number" min="0" placeholder="0"></div></div><div class="auto-calc-strip"><div><span data-i18n="autoVolumeLabel">Объём</span><b id="autoVolume">0 m³</b></div><div><span data-i18n="autoVolumetricLabel">Объёмный вес</span><b id="autoVolumetricWeight">0 kg</b></div><div><span data-i18n="factorLabel">Фактор</span><b id="autoFactor">167 kg/m³</b></div></div>
<div class="dimensions"><div id="containerWarning" class="container-warning hidden"></div><div class="dimensions-head"><span id="dimensionsTitle" data-i18n="dimensions">ГАБАРИТЫ ОДНОГО МЕСТА, мм</span><div class="unit-switch" aria-label="Единицы измерения"><button type="button" class="unit-choice active" data-unit="mm">мм</button><button type="button" class="unit-choice" data-unit="cm">см</button><button type="button" class="unit-choice" data-unit="m">м</button></div></div><div class="grid three"><div class="field"><label data-i18n="length">Длина <span class="dimension-unit-label">мм</span></label><input id="length" type="number" min="0" placeholder="0"></div><div class="field"><label data-i18n="width">Ширина <span class="dimension-unit-label">мм</span></label><input id="width" type="number" min="0" placeholder="0"></div><div class="field"><label data-i18n="height">Высота <span class="dimension-unit-label">мм</span></label><input id="height" type="number" min="0" placeholder="0"></div></div></div>
